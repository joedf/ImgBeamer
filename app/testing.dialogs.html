<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>ImgBeamer dialog test</title>

		<link rel="icon" href="src/img/favicon.ico" type="image/x-icon" />

		<link rel="stylesheet" href="src/3rd-party/jquery-ui-1.13.2.custom/jquery-ui.min.css">

		<link rel="stylesheet" href="src/css/style.css">
		<script src="src/3rd-party/konva/v9.3.2/konva.min.js"></script>
		<script src="src/3rd-party/jquery-3.6.1.min.js"></script>
		<script src="src/3rd-party/jquery-ui-1.13.2.custom/jquery-ui.min.js"></script>
		<script src="src/3rd-party/jquery-dialogextend/jquery.dialogextend.v2.0.4.dev.js"></script>
		<script src="src/3rd-party/dat.gui/dat.gui.min.js"></script>
		<script src="src/3rd-party/UTIF.js"></script>
		<script src="src/3rd-party/image-ms-ssim.js"></script>

		<script src="src/utils.js"></script>
	</head>
	<body>
		<div class="layout" id="main-container">
			<div class="stage-dlg"><div class="stageContainer"></div></div>
			<div class="stage-dlg"><div class="stageContainer"></div></div>
			<div class="stage-dlg"><div class="stageContainer"></div></div>
			<div class="stage-dlg"><div class="stageContainer"></div></div>
			<div class="stage-dlg"><div class="stageContainer"></div></div>
			<div class="stage-dlg"><div class="stageContainer"></div></div>
			<div class="stage-dlg dlg-start-minimized"><div class="stageContainer"></div></div>
			<div class="stage-dlg dlg-start-minimized"><div class="stageContainer"></div></div>
			<div class="stage-dlg dlg-start-minimized"><div class="stageContainer"></div></div>
		</div>

		<div id="options-anchor">
			<div id="options">
				<div id="options-handle">&#9776;</div>
				<input type="file" id="_fileImgInput" accept="image/*" style="display: none;" />
			</div>
		</div>

		<div id="options-full-resample-anchor" style="display: none;">
			<div id="options-full-resample">
				<details>
					<summary>Full Resample Panel</summary>
					<table>
						<tr>
							<td>Cell Width</td>
							<td><input type="number" id="iCellW" placeholder="10"> px</td>
						</tr>
						<tr>
							<td>Cell Height</td>
							<td><input type="number" id="iCellH" placeholder="10"> px</td>
						</tr>
						<tr>
							<td>Spot Size X</td>
							<td><input type="number" id="iSpotX" placeholder="60"> %</td>
						</tr>
						<tr>
							<td>Spot Size Y</td>
							<td><input type="number" id="iSpotY" placeholder="60"> %</td>
						</tr>
						<tr>
							<td>Spot Angle (clockwise)</td>
							<td><input type="number" id="iSpotAngle" placeholder="0"> deg.</td>
						</tr>
						<tr>
							<td>Resample Fully</td>
							<td>
								<button id="generateFull">Generate</button>
								<svg id="loadspinner_full" class="load_spinner_svg"
									style="display:none"
									xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid" viewBox="0 0 16 16">
									<circle fill="none" stroke="#00d8ff" stroke-dasharray="28.274333882308138 11.42477796076938" cx="8" cy="8" r="6" stroke-width="2">
									<animateTransform attributeName="transform" type="rotate" repeatCount="indefinite" keyTimes="0;1" values="0 8 8;360 8 8" dur="1s"></animateTransform>
									</circle>
								</svg>
							</td>
						</tr>
						<tr>
							<td>Status</td>
							<td>
								<pre id="status">-</pre>
							</td>
						</tr>
					</table>
				</details>
			</div>
		</div>

		<script>
			const G_STAGE_SIZE = GetOptimalBoxWidth();
			const G_BOXES_PER_ROW = 3;
			let g_dlg_selector = '.stage-dlg';

			$(g_dlg_selector).dialog({
				maxHeight: 800,
				maxWidth: 800,
				minHeight: 200,
				minWidth: 200,
				width: G_STAGE_SIZE,
				height: G_STAGE_SIZE + 27.6333 - 3.767,
				resizable: false,
				classes: {
					"ui-dialog": "stage-dialog",
				},
				drag: function( event, ui ) {
					// https://stackoverflow.com/a/20712561/883015
					var snapTolerance = (G_STAGE_SIZE/10) + 0.2; //$(this).draggable('option', 'snapTolerance');
					var grid = {
						x: (G_STAGE_SIZE/10) + 0.2,
						y: (G_STAGE_SIZE + 27.6333 - 3.767) / 10,
					};

					var topRemainder = ui.position.top % grid.y;
					var leftRemainder = ui.position.left % grid.x;

					if (topRemainder <= snapTolerance) {
						ui.position.top = ui.position.top - topRemainder;
					}

					if (leftRemainder <= snapTolerance) {
						ui.position.left = ui.position.left - leftRemainder;
					}
				},
				resize: function( event, ui ) {
					// https://stackoverflow.com/a/20712561/883015
					var snapTolerance = 80; //$(this).draggable('option', 'snapTolerance');
					var grid = {
						x: 20,
						y: 20,
					};

					var widthRemainder = ui.size.width % grid.x;
					var heightRemainder = ui.size.height % grid.y;
					
					if (widthRemainder <= snapTolerance) {
						ui.size.width = ui.size.width - widthRemainder;
					}

					if (heightRemainder <= snapTolerance) {
						ui.size.height = ui.size.height - heightRemainder;
					}
				}
			}).dialogExtend({
				"closable" : false,
				"maximizable" : false,
				"minimizable" : true,
				"collapsable" : true,
				"dblclick" : "collapse",
				"minimizeLocation" : "right",
				"icons": {
					"collapse": "ui-icon-arrowthickstop-1-n"
				},
				"load": function(evt, dlg){
					var e = $(this);
					if (e.hasClass('dlg-start-minimized')) {
						e.dialogExtend('minimize');
					}
				}
			});

			// tile dialogs
			// position first one
			$(g_dlg_selector).dialog('widget').eq(0).css({top:0, left:0});

			// tile the first 6 dialogs
			let dialogs = $(g_dlg_selector).dialog();
			let dialogs_count = 6; // dialogs.length;
			for (let i = 1; i < dialogs_count; i++) {
				const dialog = dialogs.eq(i);
				const prev = dialogs.eq(i-1).dialog('widget');

				if (i % G_BOXES_PER_ROW == 0) {
					const prev = dialogs.eq(i-G_BOXES_PER_ROW).dialog('widget');
					var eDialog = prev.get(0);
					var newPos = {
						x: parseInt(prev.css('left')),
						y: eDialog.offsetHeight + parseInt(prev.css('top')),
					};
					dialog.dialog('widget').css({top:newPos.y, left:newPos.x})
				} else {
					dialog.dialog({position: {my:"left top", at:"right top", of:$(prev)}});
				}
			}

			// cascade the last 3 dialogs
			let cascade_start = 6;
			$(g_dlg_selector).eq(cascade_start).dialog({position: {my:"right top", at:"right top", of:'body'}});
			for (let i = 7; i < dialogs.length; i++) {
				const dialog = dialogs.eq(i);
				const prev = dialogs.eq(i-1).dialog('widget');
				const n = i - cascade_start;
				dialog.dialog('widget').css({
					top:80*n, right:80*n, left:'auto',
					'z-index':parseInt(prev.css('z-index'))+1
				});
			}
		</script>

		<script src="src/drawsteps.js"></script>
		<script src="src/img_metrics.js"></script>
		<script src="src/main.js"></script>
		<script src="src/gui.js"></script>
	</body>
</html>
